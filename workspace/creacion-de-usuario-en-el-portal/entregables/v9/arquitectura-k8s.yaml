# Generado por Trama. Aplicar con: kubectl apply -f k8s.yaml
# Reemplace ${ECR_REGISTRY} y ${TAG}; cree el secreto app-secrets antes de aplicar.
apiVersion: v1
kind: Namespace
metadata:
  name: creacion-de-usuario-en-el-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web-eks
  namespace: creacion-de-usuario-en-el-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portal-web-eks
  template:
    metadata:
      labels:
        app: portal-web-eks
    spec:
      containers:
        - name: portal-web-eks
          image: ${ECR_REGISTRY}/portal-web-eks:${TAG}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_URL
---
apiVersion: v1
kind: Service
metadata:
  name: portal-web-eks
  namespace: creacion-de-usuario-en-el-portal
spec:
  selector:
    app: portal-web-eks
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend-eks
  namespace: creacion-de-usuario-en-el-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-backend-eks
  template:
    metadata:
      labels:
        app: api-backend-eks
    spec:
      containers:
        - name: api-backend-eks
          image: ${ECR_REGISTRY}/api-backend-eks:${TAG}
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: SMTP_SERVER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_SERVER
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASSWORD
            - name: AD_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AD_ADMIN_EMAIL
---
apiVersion: v1
kind: Service
metadata:
  name: api-backend-eks
  namespace: creacion-de-usuario-en-el-portal
spec:
  selector:
    app: api-backend-eks
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creacion-de-usuario-en-el-portal
  namespace: creacion-de-usuario-en-el-portal
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-backend-eks
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-web-eks
                port:
                  number: 80
