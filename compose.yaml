name: fabrica-fase1
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabrica_local}
      POSTGRES_DB: fabrica
    ports:
      - "127.0.0.1:5543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica -d fabrica"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
